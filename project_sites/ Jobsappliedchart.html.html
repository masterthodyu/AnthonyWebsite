<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sankey chart of jobs applied">
    <title>Jobs Applied Sankey Chart</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .chart-container {
            width: 100%;
            max-width: 800px;
            margin: auto;
        }
        svg {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>
    <h1>Jobs Applied Sankey Chart</h1>
    <p>This Sankey chart represents the flow of job applications through various hiring stages.</p>
    <div class="chart-container">
        <svg id="sankey-chart"></svg>
    </div>
    <script>
        const data = {
            nodes: [
                { name: "Applications" },
                { name: "Phone Interview" },
                { name: "Technical Interview" },
                { name: "Offer" },
                { name: "Rejected" }
            ],
            links: [
                { source: 0, target: 1, value: 30 },
                { source: 1, target: 2, value: 20 },
                { source: 2, target: 3, value: 10 },
                { source: 2, target: 4, value: 10 },
                { source: 1, target: 4, value: 10 }
            ]
        };

        const width = 800, height = 500;
        const svg = d3.select("#sankey-chart")
                      .attr("width", width)
                      .attr("height", height);

        const sankey = d3.sankey()
                         .nodeWidth(20)
                         .nodePadding(10)
                         .extent([[1, 1], [width - 1, height - 6]]);

        const graph = sankey({nodes: data.nodes.map(d => Object.assign({}, d)), links: data.links.map(d => Object.assign({}, d))});

        svg.append("g")
           .selectAll("rect")
           .data(graph.nodes)
           .join("rect")
           .attr("x", d => d.x0)
           .attr("y", d => d.y0)
           .attr("height", d => d.y1 - d.y0)
           .attr("width", sankey.nodeWidth())
           .attr("fill", "steelblue");

        svg.append("g")
           .selectAll("path")
           .data(graph.links)
           .join("path")
           .attr("d", d3.sankeyLinkHorizontal())
           .attr("stroke", "#000")
           .attr("fill", "none")
           .attr("stroke-width", d => Math.max(1, d.width));
    </script>
</body>
</html>
