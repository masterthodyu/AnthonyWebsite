<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anthony Hoang's Pokémon Checklist">
    <meta name="keywords" content="Anthony Hoang, Portfolio, Projects, Pokémon, Checklist">
    <meta name="author" content="Anthony Hoang">
    <title>Pokémon Checklist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    <script src="../scripts/pokemonChecklist.js" defer></script>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="d-flex flex-column h-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">Pokémon Checklist</a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mr-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Home</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="https://www.linkedin.com/in/anthony-hoang-1a6b88158" target="_blank"><i class="fab fa-linkedin"></i></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://github.com/masterthodyu" target="_blank"><i class="fab fa-github"></i></a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="flex-shrink-0" role="main">
        <div class="container mt-5">
            <div class="save-button">
                <button onclick="save()" class="btn btn-primary">Save</button>
            </div>
            <div class="collapse-buttons text-center my-3">
                <button onclick="collapseAll()" class="btn btn-secondary">Collapse All</button>
                <button onclick="uncollapseAll()" class="btn btn-secondary">Uncollapse All</button>
            </div>
            <section id="info">
                <div id="pokemon-container" class="pokemon-container"></div>
            </section>
            <div id="pokemon-checklist" class="pokemon-container"></div>
            <div class="collapsible-container">
                <div class="collapsible-header">Standard Pokémon</div>
                <div class="collapsible-content">
                    <div id="standard" class="pokemon-container"></div>
                </div>
            </div>
            <div class="collapsible-container">
                <div class="collapsible-header">Alolan Forms</div>
                <div class="collapsible-content">
                    <div id="alolan" class="pokemon-container"></div>
                </div>
            </div>
            <div class="collapsible-container">
                <div class="collapsible-header">Galarian Forms</div>
                <div class="collapsible-content">
                    <div id="galarian" class="pokemon-container"></div>
                </div>
            </div>
            <div class="collapsible-container">
                <div class="collapsible-header">Hisuian Forms</div>
                <div class="collapsible-content">
                    <div id="hisuian" class="pokemon-container"></div>
                </div>
            </div>
            <div class="collapsible-container">
                <div class="collapsible-header">Paldean Forms</div>
                <div class="collapsible-content">
                    <div id="paldean" class="pokemon-container"></div>
                </div>
            </div>
            <div class="collapsible-container">
                <div class="collapsible-header">Gender Differences</div>
                <div class="collapsible-content">
                    <div id="gender" class="pokemon-container"></div>
                </div>
            </div>
            <div class="collapsible-container">
                <div class="collapsible-header">Mega Evolutions</div>
                <div class="collapsible-content">
                    <div id="mega" class="pokemon-container"></div>
                </div>
            </div>
            <div class="collapsible-container">
                <div class="collapsible-header">Gigantamax Forms</div>
                <div class="collapsible-content">
                    <div id="gigantamax" class="pokemon-container"></div>
                </div>
            </div>
            <div class="collapsible-container">
                <div class="collapsible-header">Alternate Forms</div>
                <div class="collapsible-content">
                    <div id="alts" class="pokemon-container"></div>
                </div>
            </div>
        </div>
    </main>
    <footer class="text-muted mt-auto py-3 bg-dark text-white">
        <div class="container text-center">
            <p>Site design by Anthony Hoang. Pokémon images and names are the property of The Pokémon Company.</p>
            <p>
                <a href="https://www.linkedin.com/in/anthony-hoang-1a6b88158" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="https://github.com/masterthodyu" target="_blank"><i class="fab fa-github"></i></a>
            </p>
        </div>
    </footer>
    <script>
        // Collapsible sections
        const collapsibles = document.getElementsByClassName("collapsible-header");
        for (let i = 0; i < collapsibles.length; i++) {
            collapsibles[i].addEventListener("click", function() {
                this.classList.toggle("active");
                const content = this.nextElementSibling;
                if (content.style.display === "block") {
                    content.style.display = "none";
                } else {
                    content.style.display = "block";
                }
            });
        }

        function collapseAll() {
            const contents = document.getElementsByClassName("collapsible-content");
            for (let i = 0; i < contents.length; i++) {
                contents[i].style.display = "none";
            }
        }

        function uncollapseAll() {
            const contents = document.getElementsByClassName("collapsible-content");
            for (let i = 0; i < contents.length; i++) {
                contents[i].style.display = "block";
            }
        }
    </script>
</body>
</html>
